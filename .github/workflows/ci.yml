name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Cache Spark/Delta jars
        uses: actions/cache@v4
        with:
          path: ~/.ivy2*
          key: ivy-${{ hashFiles('src/lakehouse/spark.py') }}
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Airflow + Spark image
        run: docker build -f docker/Dockerfile -t healthcare-lakehouse-airflow:ci .
      - name: Check the DAG loads without errors
        run: |
          docker run --rm -v "$PWD/airflow/dags:/opt/airflow/dags" healthcare-lakehouse-airflow:ci \
            bash -c "airflow db migrate >/dev/null && python -c \"from airflow.models import DagBag; b = DagBag('/opt/airflow/dags', include_examples=False); assert not b.import_errors, b.import_errors; print(sorted(b.dag_ids))\""
